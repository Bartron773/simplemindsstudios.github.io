name: Fix site metadata
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update head metadata
        run: python3 -c 'from pathlib import Path; import re,base64; p=Path("index.html"); s=p.read_text(encoding="utf-8"); m=base64.b64decode("").decode("utf-8"); pat=re.compile(r"  <meta charset=\"UTF-8\">.*?(?=  <link rel=\"preconnect\" href=\"https://fonts\\.googleapis\\.com\")",re.S); u,n=pat.subn(m,s,count=1); assert n==1, f"metadata replacements={n}"; p.write_text(u,encoding="utf-8")'
      - name: Verify metadata
        run: test -f images/favicon.svg && test -f images/social-preview.PNG && grep -Fq 'href="/images/favicon.svg"' index.html && grep -Fq 'https://simplemindsstudios.com/images/social-preview.PNG' index.html && grep -Fq 'rel="canonical" href="https://simplemindsstudios.com/"' index.html
      - name: Commit fixes
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && rm .github/workflows/metadata-fix.yml && git add index.html .github/workflows/metadata-fix.yml && git commit -m "Fix favicon and social preview metadata" && git push
