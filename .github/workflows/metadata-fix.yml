name: Fix site metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/metadata-fix.yml

permissions:
  contents: write

jobs:
  fix-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair favicon and social metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          metadata = '''  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Minds Studios — An Environment for Asking Questions</title>

  <meta name="description" content="A living cultural space for research, design, film, fashion, music, civic imagination, and the ideas that become more interesting when we stay with them.">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://simplemindsstudios.com/">

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/images/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Simple Minds Studios">
  <meta property="og:url" content="https://simplemindsstudios.com/">
  <meta property="og:title" content="Simple Minds Studios — An Environment for Asking Questions">
  <meta property="og:description" content="A living cultural space for research, design, film, fashion, music, civic imagination, and the ideas that become more interesting when we stay with them.">
  <meta property="og:image" content="https://simplemindsstudios.com/images/social-preview.PNG">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Simple Minds Studios — A Place for Questions">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Simple Minds Studios — An Environment for Asking Questions">
  <meta name="twitter:description" content="A living cultural space for research, design, film, fashion, music, civic imagination, and the ideas that become more interesting when we stay with them.">
  <meta name="twitter:image" content="https://simplemindsstudios.com/images/social-preview.PNG">

'''

          pattern = re.compile(
              r'  <meta charset="UTF-8">.*?(?=  <link rel="preconnect" href="https://fonts\.googleapis\.com")',
              re.DOTALL,
          )
          updated, count = pattern.subn(metadata, html, count=1)
          if count != 1:
              raise SystemExit(f"Expected one metadata block; replaced {count}.")

          path.write_text(updated, encoding="utf-8")

      - name: Verify expected paths
        shell: bash
        run: |
          test -f images/favicon.svg
          test -f images/social-preview.PNG
          grep -Fq 'href="/images/favicon.svg"' index.html
          grep -Fq 'https://simplemindsstudios.com/images/social-preview.PNG' index.html
          grep -Fq 'rel="canonical" href="https://simplemindsstudios.com/"' index.html

      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/metadata-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/metadata-fix.yml
          git commit -m "Fix favicon and social preview metadata"
          git push
