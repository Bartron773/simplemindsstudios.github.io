name: Restore recovered SMS index

on:
  push:
    branches: [main]
    paths:
      - '.recovery/run.txt'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble, restore, and verify index
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .recovery/chunk00.txt \
            .recovery/chunk01.txt \
            .recovery/chunk02.txt \
            .recovery/chunk03.txt \
            .recovery/chunk04.txt \
            .recovery/chunk05.txt \
            .recovery/chunk06.txt \
            .recovery/chunk07_0_0.txt \
            .recovery/chunk07_0_1.txt \
            .recovery/chunk07_0_2.txt \
            .recovery/chunk07_0_3.txt \
            .recovery/chunk07_1.txt \
            .recovery/chunk07_2.txt \
            .recovery/chunk07_3.txt \
            > /tmp/index.b64
          base64 -d /tmp/index.b64 | gzip -dc > index.html
          test "$(wc -c < index.html)" -eq 192364
          grep -Fq 'Simple Minds Studios — An Environment for Asking Questions' index.html
          grep -Fq 'G-8QL1DX6CTL' index.html
          grep -Fq 'og:image' index.html
          grep -Fq 'twitter:card' index.html
          grep -Fq 'createRoot(document.getElementById("root")).render' index.html
          grep -Fq '</html>' index.html

      - name: Commit recovered site and remove recovery files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          rm -f .github/workflows/restore-recovered-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore recovered Simple Minds Studios site'
          git push
