  <style>
    :root{
      --deep:#0B0A14;--void:#110d1f;--mauve:#7d5e8a;--blush:#c4a0b4;--cyan:#5bcfef;--amber:#C9A86A;
      --white:#fff;--ink:rgba(255,255,255,.94);--muted:rgba(255,255,255,.68);--soft:rgba(255,255,255,.44);
      --glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.10);--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.22);
      --shadow:0 30px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset;
      --display:'Playfair Display',Georgia,serif;--body:'DM Sans',system-ui,sans-serif;--mono:'Fira Code',monospace;
      --radius-pill:999px;--radius-xl:30px;--radius-lg:24px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
    a{color:inherit}
    /* Atmospheric Background - Liquid Glass */
    .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
      radial-gradient(60% 60% at 18% 14%,rgba(125,94,138,.28),transparent 60%),
      radial-gradient(50% 50% at 86% 78%,rgba(91,207,239,.18),transparent 55%),
      radial-gradient(40% 40% at 50% 50%,rgba(196,160,180,.10),transparent 70%),
      linear-gradient(145deg,#0B0A14 0%,#120d20 52%,#0B0A14 100%)}
    .scene:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.06),transparent 50%);mix-blend-mode:screen}
    .scene:after{content:"";position:absolute;inset:-25%;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:80px 80px;transform:rotate(-8deg);mask-image:radial-gradient(circle at center,#000,transparent 72%);opacity:.7}
    .shape{position:absolute;left:50%;top:42%;width:min(62vw,720px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 0 80px rgba(91,207,239,.18));animation:drift 28s ease-in-out infinite alternate}
    .shape:before,.shape:after{content:"";position:absolute;inset:12%;border:1px solid rgba(255,255,255,.16);border-radius:39% 61% 52% 48% / 47% 36% 64% 53%;transform:rotate(18deg);backdrop-filter:blur(.5px)}
    .shape:after{inset:25%;border-color:rgba(91,207,239,.28);transform:rotate(-34deg)}
    @keyframes drift{to{transform:translate(-50%,-48%) rotate(6deg) scale(1.04)}}
    /* Liquid Glass primitives */
    .glass{
      background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(28px) saturate(1.3);
      -webkit-backdrop-filter:blur(28px) saturate(1.3);
      transition:transform .35s ease,border-color .35s ease;
    }
    .glass:hover{border-color:var(--border-strong);transform:translateY(-2px)}
    .wrap{width:min(1240px,calc(100% - 40px));margin:auto;position:relative;z-index:2}
    .topbar{position:fixed;inset:0 0 auto;z-index:30;padding:16px 0}
    .nav{
      display:flex;justify-content:space-between;align-items:center;gap:24px;
      padding:12px 22px;border-radius:var(--radius-pill);
      background:rgba(11,10,20,.55);border:1px solid var(--border);
      backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
      box-shadow:0 10px 40px rgba(0,0,0,.35)
    }
    .brand{font-weight:700;text-decoration:none;letter-spacing:-.02em}.brand span{color:var(--cyan)}
    .navlinks{display:flex;gap:18px;flex-wrap:wrap}.navlinks a{font:500 .62rem var(--mono);text-decoration:none;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.navlinks a:hover{color:var(--cyan)}
    .sound-toggle{display:flex;gap:8px;align-items:center}
    .sound-toggle button{font:500 .58rem var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--soft);background:transparent;border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 10px;cursor:pointer}
    .sound-toggle button.active{color:var(--cyan);border-color:var(--cyan)}
    /* Threshold / Hero */
    .threshold{min-height:100svh;display:grid;place-items:center;text-align:center;padding:132px 0 80px;position:relative}
    .threshold-inner{max-width:980px}
    .eyebrow,.label,.kicker,.status,.room-number{font:500 .65rem var(--mono);text-transform:uppercase;letter-spacing:.18em}
    .eyebrow,.label,.kicker,.room-number{color:var(--cyan)}
    h1,h2,h3{font-family:var(--display);margin-top:0}
    h1{font-size:clamp(3.2rem,10vw,9rem);line-height:.84;letter-spacing:-.065em;margin:24px 0 22px}
    h1 em,h2 em{font-weight:400;color:var(--blush)}
    h2{font-size:clamp(2.4rem,6vw,5.5rem);line-height:.95;letter-spacing:-.05em;margin-bottom:18px}
    h3{font-size:clamp(1.6rem,2.8vw,2.4rem);margin-bottom:10px;letter-spacing:-.02em}
    .sub{font-size:clamp(1rem,2vw,1.18rem);line-height:1.8;color:var(--muted);max-width:72ch}
    .threshold .sub{margin-inline:auto;max-width:62ch}
    .thesis{margin:28px auto 0;max-width:56ch;padding:18px 22px;border-radius:var(--radius-pill);font-size:clamp(.95rem,1.6vw,1.08rem);line-height:1.6;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .thesis em{font-family:var(--display);font-style:italic}
    .enter{display:inline-flex;align-items:center;gap:12px;margin-top:32px;padding:14px 22px;border:1px solid var(--border);border-radius:var(--radius-pill);text-decoration:none;font:500 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all .25s ease}
    .enter:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
    .hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font:500 .58rem var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--soft)}
    /* Sections */
    .section{padding:110px 0 30px}.section-head{margin-bottom:38px}
    .rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .room{position:relative;min-height:390px;padding:38px;border-radius:var(--radius-xl);display:flex;flex-direction:column;text-decoration:none;overflow:hidden}
    .room:after{content:"↗";position:absolute;right:30px;top:25px;font-size:1.25rem;color:var(--soft)}
    .room p{color:var(--muted);line-height:1.75;max-width:54ch}
    .room .status{margin-top:auto;padding-top:34px;color:var(--soft)}
    .room.featured{grid-column:1/-1;min-height:480px;justify-content:flex-end;background:linear-gradient(120deg,rgba(125,94,138,.20),rgba(91,207,239,.08))}
    .room.featured h3{font-size:clamp(2.8rem,7vw,6rem);line-height:.9;max-width:13ch}
    .room.closed{border-style:dashed}.room.closed:after{content:""}
    /* Questions */
    .questions{display:grid;gap:1px;border-top:1px solid var(--border)}
    .question{display:grid;grid-template-columns:110px 1fr auto;gap:24px;align-items:center;padding:28px 8px;border-bottom:1px solid var(--border);text-decoration:none}
    .question:hover .qtext{color:var(--cyan)}
    .qtext{font:italic clamp(1.35rem,3vw,2.35rem) var(--display);transition:color .25s ease}
    .qmeta{font:500 .58rem var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.13em}
    /* Collection */
    .collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .card{padding:28px;border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:315px}
    .card p{color:var(--muted);line-height:1.7;font-size:.96rem}
    .card .actions{margin-top:auto
