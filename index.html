        @font-face {
          font-family: "Optimistic";
          src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

          font-weight: 400;
          font-style: normal;
          font-display: swap;

        :root {
          --deep: #090711;
          --void: #110d1f;
          --mauve: #7d5e8a;
          --blush: #c4a0b4;
          --cyan: #5bcfef;
          --glass: rgba(255,255,255,0.045);
          --glass-2: rgba(255,255,255,0.07);
          --border: rgba(255,255,255,0.15);
          --text: #f5f1f6;
          --muted: rgba(245,241,246,0.66);
          --faint: rgba(245,241,246,0.42);
          --shadow: 0 12px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
          --wrap: min(1240px, calc(100% - 40px));
          --mono: "Optimistic Mono", "Fira Code", ui-monospace, monospace;
          --sans: "Optimistic", "DM Sans", system-ui, -apple-system, Segoe UI, sans-serif;
          --serif: "Playfair Display", Georgia, serif;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body { margin: 0; padding: 0; }
        body {
          background: var(--deep);
          color: var(--text);
          font-family: var(--sans);
          -webkit-font-smoothing: antialiased;
          overflow-x: hidden;
          line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }
        a:hover { text-decoration: underline; text-underline-offset: 4px; }
        button { font: inherit; }

        .page {
          position: relative;
          isolation: isolate;
          width: 100%;
          max-width: 100vw;
          overflow-x: clip;
          background:
            radial-gradient(1200px 700px at 20% -10%, rgba(123,94,138,0.28), transparent 60%),
            radial-gradient(900px 600px at 90% 10%, rgba(91,207,239,0.16), transparent 60%),
            radial-gradient(800px 500px at 50% 120%, rgba(196,160,180,0.12), transparent 70%),
            linear-gradient(180deg, var(--void), var(--deep));
          min-height: 100vh;
        }

        /* geometric drift - lightweight, no heavy blur stacking */
        .drift {
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: -1;
          overflow: hidden;
          max-width: 100vw;
        }
        .drift i {
          position: absolute;
          display: block;
          border: 1px solid rgba(255,255,255,0.08);
          opacity: 0.35;
          max-width: 100vw;
        }

          animation: driftA 38s ease-in-out infinite alternate;
        }
        .drift i:nth-child(2) {
          width: min(320px, 80vw); height: min(320px, 80vw);
          right: -40px; top: 42vh;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: radial-gradient(circle at 70% 20%, rgba(91,207,239,0.14), transparent 65%);
          animation: driftB 46s ease-in-out infinite alternate;
        }
        .drift i:nth-child(3) {
          width: min(540px, 110vw); height: min(540px, 110vw);
          left: 38%; top: 68vh;
          border-radius: 50%;
          border-style: dashed;
          opacity: 0.18;
          animation: driftC 62s ease-in-out infinite alternate;

          width: var(--wrap);
          margin-inline: auto;
        }

        .topbar {
          position: sticky;
          top: 0;
          z-index: 50;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          background: rgba(9,7,17,0.72);
          border-bottom: 1px solid var(--border);
        }
        .topbar-inner {
          width: var(--wrap);
          margin: 0 auto;
          min-height: 64px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 24px;
        }
        .brand {
          font-family: var(--serif);
          font-weight: 700;
          letter-spacing: -0.02em;
          font-size: 16px;
          line-height: 1;
          white-space: nowrap;
        }
        .brand span {
          font-family: var(--mono);
          font-weight: 400;
          font-size: 11px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          opacity: 0.6;
          margin-left: 12px;
        }
        .navlinks {
          display: flex;
          align-items: center;
          gap: 28px;
        }
        .navlinks a {
          font-family: var(--mono);
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--muted);
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          position: relative;
        }
        .navlinks a:hover { color: var(--text); text-decoration: none; }
        .navlinks a::after {
          content: "";
          position: absolute;
          left: 0; right: 0; bottom: 10px;
          height: 1px;
          background: var(--blush);
          transform: scaleX(0);
          transform-origin: left;
          transition: transform .35s ease;
        }
        .navlinks a:hover::after { transform: scaleX(1); }

        /* hero - 100svh */
        .hero {
          min-height: 100svh;
          display: grid;
          align-items: center;
          padding: 88px 0 64px;
          position: relative;
        }
        .hero-grid {
          display: grid;
          grid-template-columns: 1.2fr 0.8fr;
          gap: 40px;
          align-items: end;
        }
        .eyebrow {
          font-family: var(--mono);
          font-size: 12px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--faint);
          margin-bottom: 28px;
          display: flex;
          gap: 12px;
          align-items: center;
        }
        .eyebrow::before {
          content: "";
          width: 28px; height: 1px;
          background: var(--border);
          display: inline-block;
        }
        .h1 {
          font-family: var(--serif);
          font-weight: 900;
          font-size: clamp(44px, 8.2vw, 112px);
          line-height: 0.88;
          letter-spacing: -0.04em;
          margin: 0;
          text-transform: uppercase;
        }
        .h1 em {
          font-family: var(--serif);
          font-style: italic;
          font-weight: 400;
          text-transform: none;
          letter-spacing: -0.02em;
          color: var(--blush);
          display: block;
          margin-top: 4px;
        }
        .hero-copy {
          padding-bottom: 8px;
        }
        .hero-sub {
          font-size: clamp(16px, 1.6vw, 19px);
          line-height: 1.55;
          color: var(--muted);
          max-width: 46ch;
          margin: 28px 0 0;
          font-weight: 300;
        }
        .cta-row {
          margin-top: 36px;
          display: flex;
          flex-wrap: wrap;
          gap: 20px;
          align-items: center;
        }
        .cta {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 48px;
          padding: 0 22px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: var(--glass);
          box-shadow: var(--shadow);
          font-family: var(--mono);
          font-size: 12px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--text);
          transition: background .25s, border-color .25s, transform .25s;
        }
        .cta:hover {
          background: var(--glass-2);
          border-color: rgba(255,255,255,0.22);
          text-decoration: none;
          transform: translateY(-1px);
        }
        .hint {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--faint);
        }

        /* sections */
        section {
          padding: 96px 0;
          border-top: 1px solid rgba(255,255,255,0.06);
        }
        .section-head {
          display: grid;
          grid-template-columns: 240px 1fr;
          gap: 24px;
          margin-bottom: 48px;
        }
        .kicker {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--blush);
        }
        .section-title {
          font-family: var(--serif);
          font-size: clamp(28px, 3.4vw, 44px);
          line-height: 1.05;
          letter-spacing: -0.03em;
          margin: 0;
          font-weight: 700;
        }
        .section-title small {
          display: block;
          font-family: var(--sans);
          font-weight: 300;
          font-size: 16px;
          line-height: 1.5;
          letter-spacing: 0;
          color: var(--muted);
          margin-top: 12px;
          max-width: 52ch;
        }

        /* rooms */
        .rooms-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        .room {
          position: relative;
          border: 1px solid var(--border);
          background: var(--glass);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border-radius: 20px;
          padding: 28px 28px 24px;
          box-shadow: var(--shadow);
          min-height: 220px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          transition: border-color .3s, background .3s;
        }
        .room:hover {
          border-color: rgba(255,255,255,0.22);
          background: rgba(255,255,255,0.06);
        }
        .room-top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 18px;
        }
        .room-id {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--faint);
        }
        .room-tag {
          font-family: var(--mono);
          font-size: 10px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          padding: 6px 10px;
          border-radius: 999px;
          border: 1px solid var(--border);
          color: var(--muted);
        }
        .room h3 {
          font-family: var(--serif);
          font-size: 24px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          margin: 0 0 10px;
          font-weight: 700;
        }
        .room h3 span {
          font-weight: 400;
          font-style: italic;
          color: var(--blush);
        }
        .room p {
          margin: 0;
          color: var(--muted);
          font-size: 14.5px;
          line-height: 1.6;
          max-width: 52ch;
          font-weight: 300;
        }
        .room-foot {
          margin-top: 22px;
          display: flex;
          gap: 14px;
          flex-wrap: wrap;
          align-items: center;
        }
        .room-link {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--cyan);
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          border-bottom: 1px solid rgba(91,207,239,0.28);
          padding-bottom: 1px;
        }
        .room-link:hover { text-decoration: none; border-color: var(--cyan); }

        /* questions */
        .q-list {
          display: grid;
          gap: 1px;
          background: rgba(255,255,255,0.08);
          border: 1px solid var(--border);
          border-radius: 20px;
          overflow: hidden;
          box-shadow: var(--shadow);
        }
        .q {
          display: grid;
          grid-template-columns: 96px 1fr 180px;
          gap: 24px;
          padding: 28px 28px;
          background: rgba(17,13,31,0.88);
          align-items: start;
        }
        .q:nth-child(even) { background: rgba(9,7,17,0.92); }
        .q-id {

          font-size: 12px;
          color: var(--mauve);
          letter-spacing: 0.12em;
        }
        .q-text {
          font-family: var(--serif);

          line-height: 1.35;
          letter-spacing: -0.01em;
        }
        .q-note {
          font-family: var(--sans);
          font-size: 13px;
          line-height: 1.6;
          color: var(--muted);
          font-weight: 300;
        }

        /* collection */
        .collection-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }
        .tool {
          border: 1px solid var(--border);
          background: var(--glass);
          border-radius: 18px;
          padding: 22px 20px 18px;
          box-shadow: var(--shadow);
          display: flex;
          flex-direction: column;
          gap: 12px;
          min-height: 168px;
        }
        .tool-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .tool-name {
          font-family: var(--mono);
          font-size: 13px;
          letter-spacing: 0.02em;
          font-weight: 500;
        }
        .tool-dot {
          width: 6px; height: 6px;
          border-radius: 50%;
          background: var(--cyan);
          box-shadow: 0 0 0 4px rgba(91,207,239,0.18);
        }
        .tool p {
          font-size: 13.5px;
          line-height: 1.6;
          color: var(--muted);
          margin: 0;
          font-weight: 300;
        }
        .tool a {
          margin-top: auto;
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--faint);
          min-height: 44px;
          display: inline-flex;
          align-items: center;
        }
        .tool a:hover { color: var(--text); }

        /* principles */
        .principles {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .principle {
          border-radius: 20px;
          border: 1px solid var(--border);
          background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
          padding: 32px 28px;
          box-shadow: var(--shadow);
        }
        .principle h3 {
          font-family: var(--serif);
          font-size: 30px;
          line-height: 1.05;
          letter-spacing: -0.03em;
          margin: 0 0 14px;
          font-weight: 700;
        }
        .principle p {
          margin: 0;
          color: var(--muted);
          font-size: 15px;
          line-height: 1.7;
          max-width: 48ch;
          font-weight: 300;
        }
        .principle em {
          font-family: var(--serif);
          font-style: italic;
          color: var(--blush);
        }

        /* contact */
        .contact-grid {
          display: grid;
          grid-template-columns: 1.1fr 0.9fr;
          gap: 24px;
          align-items: start;
        }
        .contact-card {
          border: 1px solid var(--border);
          border-radius: 20px;
          background: var(--glass);
          padding: 28px;
          box-shadow: var(--shadow);
        }
        .contact-card h4 {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--faint);
          margin: 0 0 18px;
        }
        .contact-lines {
          display: grid;
          gap: 12px;
        }
        .line {
          display: grid;
          grid-template-columns: 84px 1fr;
          gap: 12px;
          font-size: 14px;
          line-height: 1.5;
          align-items: baseline;
        }
        .line span:first-child {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--faint);
        }
        .line a {
          min-height: 44px;
          display: inline-flex;
          align-items: center;
          word-break: break-all;
        }
        .contact-copy {
          font-size: 15px;
          line-height: 1.7;
          color: var(--muted);
          font-weight: 300;
          max-width: 48ch;
        }
        .contact-copy strong {
          color: var(--text);
          font-weight: 500;
        }

        footer {
          padding: 36px 0 56px;
          border-top: 1px solid rgba(255,255,255,0.06);
          display: flex;
          justify-content: space-between;
          gap: 20px;
          flex-wrap: wrap;
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--faint);
        }

        /* mobile solid */
        @media (max-width: 900px) {
          .navlinks { display: none; }
          .hero-grid { grid-template-columns: 1fr; gap: 28px; }
          .hero { padding: 88px 0 40px; min-height: 100svh; }
          .section-head { grid-template-columns: 1fr; gap: 12px; }
          .rooms-grid { grid-template-columns: 1fr; }
          .q { grid-template-columns: 1fr; gap: 10px; padding: 22px 20px; }
          .collection-grid { grid-template-columns: 1fr; }
          .principles { grid-template-columns: 1fr; }
          .contact-grid { grid-template-columns: 1fr; }
          .line { grid-template-columns: 1fr; gap: 2px; }
        }

        @media (prefers-reduced-motion: reduce) {
          * { animation: none !important; transition: none !important; }
          html { scroll-behavior: auto; }
        }
